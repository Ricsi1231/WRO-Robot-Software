[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "calibrate"]
packages = ["wro"]

[project]
name = "wro-robot-software"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "opencv-python",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15,<0.16",
    "mypy>=2.0,<3.0",
    "pytest>=9.0,<10.0",
    "pytest-cov>=7.0,<8.0",
    "pre-commit>=4.0,<5.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W", "RUF"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["picamera2.*", "gpiozero.*", "cv2.*", "pigpio.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = [
    "hardware: requires real Raspberry Pi hardware (skipped by default in CI)",
    "slow: tests that take more than a couple of seconds",
]
norecursedirs = ["component_tests", ".venv", "build", "dist"]

[tool.coverage.run]
branch = true
source = ["wro"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = false
