[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "calibrate"]
packages = ["wro"]

[project]
name = "wro-robot-software"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "opencv-python",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pre-commit",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["picamera2.*", "gpiozero.*", "cv2.*", "pigpio.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = [
    "hardware: requires real Raspberry Pi hardware (skipped by default in CI)",
    "slow: tests that take more than a couple of seconds",
]
norecursedirs = ["component_tests", ".venv", "build", "dist"]
